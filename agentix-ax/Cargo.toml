[package]
name = "agentix-ax"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "General-purpose code development agent CLI"

[[bin]]
name = "ax"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agentix-api = { path = "../agentix-api", version = "0.2" }
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
agentix-harness = { path = "../agentix-harness" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
ratatui = "0.29"
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
