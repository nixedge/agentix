[package]
name = "agentix-ourgroceries"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust adapter for an existing OurGroceries list"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
agentix-assistant-core = { path = "../agentix-assistant-core" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
wiremock = "0.6"
