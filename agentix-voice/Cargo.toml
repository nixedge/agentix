[package]
name = "agentix-voice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Desktop voice loop daemon for agentix — wake word, STT, TTS"

[[bin]]
name = "agentix-voice"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agentix-tts = { path = "../agentix-tts" }
agentix-api = { path = "../agentix-api" }
cpal = "0.15"
rubato = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
