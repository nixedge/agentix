[package]
name = "agentix-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Home assistant agent daemon — todos, calendar, gmail, ntfy.sh push notifications"

[[bin]]
name = "agentix-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agentix-harness = { path = "../agentix-harness" }
agentix-api     = { path = "../agentix-api" }
agentix-tts     = { path = "../agentix-tts" }

axum            = { version = "0.8", features = ["json", "multipart"] }
tokio           = { version = "1", features = ["full"] }
tokio-util      = { version = "0.7", features = ["rt"] }
reqwest         = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }

sled            = "0.34"

yup-oauth2      = { version = "12", features = ["hyper-rustls", "service-account"] }
hyper-util      = { version = "0.1", features = ["client-legacy"] }

serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
chrono          = { version = "0.4", features = ["serde"] }
uuid            = { version = "1", features = ["v4", "serde"] }
clap            = { version = "4", features = ["derive"] }

metrics                   = "0.22"
metrics-exporter-prometheus = "0.14"

async-trait     = "0.1"
anyhow          = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tower    = "0.5"
http-body-util = "0.1"
