[package]
name = "agentix-search"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
agentix-store = { path = "../agentix-store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastembed = "6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
