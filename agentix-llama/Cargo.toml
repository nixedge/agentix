[package]
name = "agentix-llama"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "LlamaCpp inference backend for agentix"

build = "build.rs"

[[bin]]
name = "agentix-llama"
path = "src/main.rs"

[lints]
workspace = true

[features]
cuda = ["llama-cpp-2/cuda"]

[dependencies]
agentix-api = { path = "../agentix-api" }
agentix-infer = { path = "../agentix-infer" }
llama-cpp-2 = { version = "0.1", features = ["common"] }
uuid = { version = "1", features = ["v4"] }
minijinja = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# Binary-only deps (HTTP server, logging)
axum = { version = "0.8", features = ["json"] }
anyhow = "1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
agentix-infer = { path = "../agentix-infer" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
