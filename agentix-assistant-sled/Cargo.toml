[package]
name = "agentix-assistant-sled"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Durable Sled repository for Agentix personal assistant records"

[lints]
workspace = true

[dependencies]
agentix-assistant-core = { path = "../agentix-assistant-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
