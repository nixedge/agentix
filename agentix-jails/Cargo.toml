[package]
name = "agentix-jails"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "claude-jail"
path = "src/jail/main.rs"

[[bin]]
name = "ax-jail"
path = "src/ax_jail/main.rs"

[[bin]]
name = "gh-jail-client"
path = "src/gh_proxy/client.rs"

[[bin]]
name = "gh-jail-server"
path = "src/gh_proxy/server.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
