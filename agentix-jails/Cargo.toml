[package]
name = "agentix-jails"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "claude-jail"
path = "src/jail/main.rs"

[[bin]]
name = "ax-jail"
path = "src/ax_jail/main.rs"

[[bin]]
name = "codex-jail"
path = "src/codex_jail/main.rs"

[[bin]]
name = "gh-jail-client"
path = "src/gh_proxy/client.rs"

[[bin]]
name = "gh-jail-server"
path = "src/gh_proxy/server.rs"

[[bin]]
name = "gpu-vulkan-smoke"
path = "src/gpu_vulkan_smoke/main.rs"
required-features = ["gpu-vulkan-smoke"]

[features]
gpu-vulkan-smoke = ["dep:ash"]

[lints]
workspace = true

[dependencies]
ash = { workspace = true, optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
