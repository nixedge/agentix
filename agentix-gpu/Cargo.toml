[package]
name = "agentix-gpu"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared local GPU memory admission and allocation leases"

[[bin]]
name = "agentix-gpu-coordinator"
path = "src/bin/coordinator.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
