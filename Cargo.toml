[workspace]
members = [
  "agentix-api",
  "agentix-router",
  "agentix-daemon",
  "agentix-harness",
  "agentix-ax",
  "agentix-infer",
  "agentix-search",
  "agentix-indexer",
  "agentix-llama",
  "agentix-whisper",
  "agentix-mcp-server",
  "agentix-jails",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
