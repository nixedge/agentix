[workspace]
members = [
  "agentix-api",
  "agentix-router",
  "agentix-daemon",
  "agentix-harness",
  "agentix-ax",
  "agentix-infer",
  "agentix-qwen",
  "agentix-qwen-sys",
  "agentix-qwen-worker",
  "agentix-search",
  "agentix-indexer",
  "agentix-llama",
  "agentix-whisper",
  "agentix-mcp-server",
  "agentix-jails",
  "agentix-agent",
  "agentix-tts",
  "agentix-voice",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
minijinja = { version = "2.24.0", features = ["json"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[patch.crates-io]
# kokoro-tts 0.3.3 uses ort::execution_providers::CUDAExecutionProvider (rc.9 API)
# but our workspace uses ort =2.0.0-rc.13 where it was renamed to ort::ep::CUDA.
# This local patch updates the two call sites.
kokoro-tts = { path = "patches/kokoro-tts" }
