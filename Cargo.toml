[workspace]
members = [
  "agentix-api",
  "agentix-router",
  "agentix-daemon",
  "agentix-harness",
  "agentix-ax",
  "agentix-infer",
  "agentix-search",
  "agentix-indexer",
  "agentix-llama",
  "agentix-whisper",
  "agentix-mcp-server",
  "agentix-jails",
  "agentix-agent",
  "agentix-tts",
  "agentix-voice",
  "vendor/codex-apply-patch",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
minijinja = { version = "=2.24.0", features = ["json", "fuel"] }
agentix-codex-patch = { path = "vendor/codex-apply-patch" }
codex-utils-pty = { git = "https://github.com/openai/codex.git", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d" }
codex-file-search = { git = "https://github.com/openai/codex.git", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d" }
codex-execpolicy = { git = "https://github.com/openai/codex.git", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[patch.crates-io]
# kokoro-tts 0.3.3 uses ort::execution_providers::CUDAExecutionProvider (rc.9 API)
# but our workspace uses ort =2.0.0-rc.13 where it was renamed to ort::ep::CUDA.
# This local patch updates the two call sites.
kokoro-tts = { path = "patches/kokoro-tts" }
